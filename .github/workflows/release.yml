name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
            artifact_name: handycam_vr-linux-x86_64
            ffmpeg_static: OFF
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            artifact_name: handycam_vr-macos-arm64
            ffmpeg_static: ON
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            artifact_name: handycam_vr-windows-x86_64
            ffmpeg_static: OFF

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y pkg-config patchelf
          wget -q "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl-shared.tar.xz" -O ffmpeg.tar.xz
          sudo mkdir -p /opt/ffmpeg
          sudo tar -xf ffmpeg.tar.xz -C /opt/ffmpeg --strip-components=1

          # BtbN bakes their build machine's prefix into the .pc files; fix it to
          # match where we actually extracted the build.
          sudo sed -i 's|^prefix=.*|prefix=/opt/ffmpeg|' /opt/ffmpeg/lib/pkgconfig/*.pc

          echo "PKG_CONFIG_PATH=/opt/ffmpeg/lib/pkgconfig" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/ffmpeg/lib" >> $GITHUB_ENV

      - name: Install x264 (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config x264

      - name: Cache static FFmpeg (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-macos-arm64-7.1

      - name: Build static FFmpeg (macOS)
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL https://ffmpeg.org/releases/ffmpeg-7.1.tar.gz -o ffmpeg.tar.gz
          tar -xf ffmpeg.tar.gz
          cd ffmpeg-7.1
          MACOSX_DEPLOYMENT_TARGET=12.0 ./configure \
            --prefix=$HOME/ffmpeg-static \
            --enable-static \
            --disable-shared \
            --enable-gpl \
            --enable-libx264 \
            --disable-programs \
            --disable-doc \
            --disable-avdevice \
            --disable-network \
            --disable-debug \
            --pkg-config-flags="--static"
          make -j$(sysctl -n hw.logicalcpu)
          make install

      - name: Set FFmpeg pkg-config path (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "PKG_CONFIG_PATH=$HOME/ffmpeg-static/lib/pkgconfig:/opt/homebrew/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install pkgconfiglite -y

          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath C:\ffmpeg-src
          $inner = Get-ChildItem C:\ffmpeg-src -Directory | Select-Object -First 1
          Move-Item $inner.FullName C:\ffmpeg

          Get-ChildItem C:\ffmpeg\lib\pkgconfig\*.pc | ForEach-Object {
            (Get-Content $_.FullName) -replace 'prefix=.*', 'prefix=C:/ffmpeg' | Set-Content $_.FullName
          }

          "PKG_CONFIG_PATH=C:\ffmpeg\lib\pkgconfig" | Out-File -Append $env:GITHUB_ENV
          "C:\ffmpeg\bin"                            | Out-File -Append $env:GITHUB_PATH

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DFFMPEG_STATIC=${{ matrix.ffmpeg_static }}
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build build --config Release

      - name: Bundle release (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p handycam-vr/lib
          cp build/handycam_vr handycam-vr/
          cp README.mdown COPYING.mdown handycam-vr/
          # Copy only the FFmpeg libs the binary actually links, not the whole
          # BtbN distribution. ldd gives the resolved path; we then copy every
          # file matching that lib's name prefix so symlinks are included too.
          ldd build/handycam_vr | awk '{print $3}' | grep /opt/ffmpeg \
            | while read lib; do
                prefix=$(basename "$lib" | sed 's/\.so.*//')
                cp -P /opt/ffmpeg/lib/${prefix}* handycam-vr/lib/
              done
          patchelf --set-rpath '$ORIGIN/lib' handycam-vr/handycam_vr
          zip -ry ${{ matrix.artifact_name }}.zip handycam-vr/

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

      - name: Bundle release (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p handycam-vr
          cp build/handycam_vr handycam-vr/
          cp README.mdown COPYING.mdown handycam-vr/
          zip -r ${{ matrix.artifact_name }}.zip handycam-vr/

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

      - name: Bundle release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path handycam-vr -Force
          Copy-Item build\Release\handycam_vr.exe handycam-vr\
          # Copy only the five FFmpeg DLLs the binary links against.
          foreach ($lib in @('avformat', 'avcodec', 'avutil', 'swscale', 'swresample')) {
            Copy-Item C:\ffmpeg\bin\$lib-*.dll handycam-vr\
          }
          Copy-Item README.mdown, COPYING.mdown handycam-vr\
          Compress-Archive -Path handycam-vr\* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            handycam_vr-linux-x86_64/handycam_vr-linux-x86_64.zip
            handycam_vr-macos-arm64/handycam_vr-macos-arm64.zip
            handycam_vr-windows-x86_64/handycam_vr-windows-x86_64.zip
